<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Lê Croá — Compras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --espresso: #1C0F07;
      --coffee:   #2C1A0E;
      --mocha:    #6B3F1F;
      --caramel:  #C49A2B;
      --latte:    #D4B896;
      --cream:    #FAF7F2;
      --milk:     #FFFFFF;
      --border:   #EAE0D5;
      --muted:    #9A8070;
      --red:      #C0392B;
      --red-bg:   #FEF0EE;
      --green:    #1E7A4E;
      --green-bg: #E8F5EE;
      --amber:    #D97706;
      --amber-bg: #FEF3C7;
      --r: 14px;
      --shadow: 0 2px 16px rgba(28,15,7,.08);
      --fn: 'DM Sans', sans-serif;
      --fh: 'DM Serif Display', serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      font-family: var(--fn);
      background: var(--cream);
      color: var(--coffee);
      min-height: 100%;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ─── LOADING ─── */
    #loading {
      position: fixed; inset: 0;
      background: var(--cream);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; z-index: 500; transition: opacity .3s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border); border-top-color: var(--coffee);
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { font-size: 14px; color: var(--muted); }

    /* ─── TOAST ─── */
    #toast {
      position: fixed; bottom: 96px; left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: var(--espresso); color: #fff;
      padding: 11px 22px; border-radius: 100px;
      font-size: 13px; font-weight: 500;
      opacity: 0; pointer-events: none;
      transition: all .25s; z-index: 400;
      white-space: nowrap;
      box-shadow: 0 4px 20px rgba(0,0,0,.25);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ════════ PIN SCREEN ════════ */
    #pin-screen {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100svh; padding: 40px 28px 60px; gap: 36px;
    }
    .pin-logo { text-align: center; }
    .pin-logo .ico { font-size: 50px; display: block; margin-bottom: 12px; filter: drop-shadow(0 4px 8px rgba(196,154,43,.3)); }
    .pin-logo h1 { font-family: var(--fh); font-size: 32px; color: var(--coffee); }
    .pin-logo p { font-size: 14px; color: var(--muted); margin-top: 4px; }

    .pin-dots { display: flex; gap: 16px; padding: 8px 0; }
    .pin-dot {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid var(--border); background: var(--milk);
      transition: all .15s cubic-bezier(.34,1.56,.64,1);
    }
    .pin-dot.filled { background: var(--coffee); border-color: var(--coffee); transform: scale(1.1); }
    .pin-dot.error  { background: var(--red); border-color: var(--red); }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      15%      { transform: translateX(-10px); }
      35%      { transform: translateX(9px); }
      55%      { transform: translateX(-6px); }
      75%      { transform: translateX(5px); }
    }
    .shake { animation: shake .4s ease; }
    .pin-hint { font-size: 13px; color: var(--red); min-height: 18px; text-align: center; }

    .numpad { display: grid; grid-template-columns: repeat(3, 72px); gap: 14px; }
    .nk {
      width: 72px; height: 72px; border: none; border-radius: 50%;
      background: var(--milk); box-shadow: var(--shadow);
      font-family: var(--fn); font-size: 24px; font-weight: 500;
      color: var(--coffee); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform .1s, background .1s;
      -webkit-tap-highlight-color: transparent;
    }
    .nk:active { transform: scale(.9); background: var(--border); }
    .nk.del { font-size: 20px; color: var(--muted); }
    .nk.ghost { background: transparent; box-shadow: none; pointer-events: none; }

    /* ════════ SHARED ════════ */
    .screen { display: none; flex-direction: column; height: 100svh; }
    .screen.active { display: flex; }

    .app-bar {
      flex-shrink: 0;
      background: var(--espresso);
      padding: 16px 20px 14px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 12px rgba(0,0,0,.2);
    }
    .app-bar h2 { font-family: var(--fh); font-size: 20px; color: #fff; }
    .app-bar .wk { font-size: 12px; color: var(--latte); margin-top: 2px; }
    .app-bar-right { display: flex; align-items: center; gap: 10px; }
    .save-dot { width: 8px; height: 8px; border-radius: 50%; background: #5CDB95; opacity: 0; transition: opacity .3s; }
    .save-dot.on { opacity: 1; }
    .btn-exit {
      background: rgba(255,255,255,.12); border: none; color: #fff;
      padding: 8px 14px; border-radius: 8px; font-size: 13px;
      font-family: var(--fn); cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-exit:active { background: rgba(255,255,255,.22); }

    .scrollable { flex: 1; overflow-y: auto; }

    .cat-label {
      position: sticky; top: 0; z-index: 10;
      padding: 12px 20px 8px;
      font-size: 10px; font-weight: 600;
      letter-spacing: 1.4px; text-transform: uppercase;
      color: var(--muted); background: var(--cream);
      border-bottom: 1px solid var(--border);
    }
    .item-group { background: var(--milk); }

    /* ════════ FUNCIONARIO ════════ */
    .func-row {
      display: flex; align-items: center;
      padding: 15px 20px; border-bottom: 1px solid var(--border);
      gap: 14px; cursor: pointer; user-select: none;
      -webkit-tap-highlight-color: transparent; transition: background .12s;
    }
    .func-row:last-child { border-bottom: none; }
    .func-row.marked { background: #FFF9F0; }

    .check-box {
      width: 26px; height: 26px; border-radius: 7px;
      border: 2px solid var(--border); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all .15s cubic-bezier(.34,1.56,.64,1); background: var(--milk);
    }
    .func-row.marked .check-box {
      background: var(--red); border-color: var(--red); transform: scale(1.05);
    }
    .check-box svg { display: none; }
    .func-row.marked .check-box svg { display: block; }

    .item-lbl { flex: 1; font-size: 15px; line-height: 1.3; }

    .qty-wrap { display: none; align-items: center; gap: 8px; }
    .func-row.marked .qty-wrap { display: flex; }

    .qty-btn {
      width: 30px; height: 30px; border-radius: 50%; border: none;
      background: var(--border); font-size: 18px; color: var(--coffee);
      cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent; transition: background .1s;
    }
    .qty-btn:active { background: var(--mocha); color: #fff; }
    .qty-field {
      width: 40px; text-align: center;
      border: 1.5px solid var(--border); border-radius: 7px;
      padding: 5px 2px; font-size: 14px; font-weight: 600;
      font-family: var(--fn); color: var(--coffee); background: var(--milk);
      -webkit-appearance: none;
    }
    .qty-field:focus { outline: none; border-color: var(--caramel); }

    /* ── obs field: padding-top para separar do item acima ── */
    .obs-wrap {
      display: none;
      padding: 10px 20px 16px;        /* top:10px cria o espaço */
      background: #FFF9F0;
      border-bottom: 1px solid var(--border);
    }
    .obs-field {
      width: 100%; border: 1.5px solid var(--border); border-radius: 8px;
      padding: 9px 12px; font-size: 13px; font-family: var(--fn);
      color: var(--coffee); background: var(--milk); resize: none;
      -webkit-appearance: none;
    }
    .obs-field::placeholder { color: var(--muted); }
    .obs-field:focus { outline: none; border-color: var(--caramel); }

    /* ─── Bottom area (func) ─── */
    .func-bottom {
      flex-shrink: 0;
      background: var(--milk);
      border-top: 1px solid var(--border);
      padding: 12px 20px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 -4px 20px rgba(28,15,7,.06);
    }
    .count-lbl { font-size: 14px; color: var(--muted); }
    .count-lbl strong { color: var(--coffee); }

    .btn-save {
      background: var(--coffee); color: #fff;
      border: none; border-radius: 10px;
      padding: 12px 22px; font-size: 14px; font-weight: 600;
      font-family: var(--fn); cursor: pointer;
      transition: all .2s; -webkit-tap-highlight-color: transparent;
      display: flex; align-items: center; gap: 8px;
    }
    .btn-save:active { transform: scale(.97); }
    .btn-save.saved { background: var(--green); }
    .btn-save.saved::before { content: '✓  '; }

    @keyframes pulse-check {
      0%   { box-shadow: 0 0 0 0 rgba(192,57,43,.35); }
      70%  { box-shadow: 0 0 0 12px rgba(192,57,43,0); }
      100% { box-shadow: 0 0 0 0 rgba(192,57,43,0); }
    }
    .check-pulse { animation: pulse-check .4s; }

    /* ════════ MAE SCREEN ════════ */
    .week-nav {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
      background: var(--milk); padding: 10px 16px;
      border-bottom: 1px solid var(--border);
    }
    .wn-btn {
      width: 36px; height: 36px; border-radius: 50%; border: none;
      background: var(--cream); color: var(--coffee);
      font-size: 18px; cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent; transition: background .1s;
    }
    .wn-btn:active { background: var(--border); }
    .wn-btn:disabled { opacity: .3; pointer-events: none; }
    .wn-label { text-align: center; }
    .wn-label .wn-date { font-size: 14px; font-weight: 600; color: var(--coffee); }
    .wn-label .wn-tag { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .wn-label .wn-tag.current { color: var(--caramel); font-weight: 600; }

    .tab-bar {
      flex-shrink: 0;
      display: flex; background: var(--milk);
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1; padding: 13px 8px;
      border: none; background: none; font-family: var(--fn);
      font-size: 13px; font-weight: 600; color: var(--muted);
      cursor: pointer; border-bottom: 3px solid transparent;
      transition: all .15s; -webkit-tap-highlight-color: transparent;
    }
    .tab-btn.active { color: var(--coffee); border-bottom-color: var(--caramel); }

    /* ── mae row: padding generoso e espaço entre linhas de detalhe ── */
    .mae-row {
      display: flex; align-items: flex-start;
      padding: 16px 16px 16px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--milk); gap: 12px;
    }
    .mae-row:last-child { border-bottom: none; }
    .mae-row.faded { opacity: .5; }

    .mae-info { flex: 1; min-width: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .mae-name { font-size: 15px; color: var(--coffee); font-weight: 500; }
    .mae-qty { font-size: 12px; color: var(--muted); margin-top: 5px; line-height: 1.5; }
    .mae-badges { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }

    .badge {
      display: inline-block;
      font-size: 10px; font-weight: 700;
      padding: 3px 9px; border-radius: 100px; letter-spacing: .3px;
    }
    .badge.pendente { background: var(--red-bg); color: var(--red); }
    .badge.comprado { background: var(--green-bg); color: var(--green); }
    .badge.adiado   { background: var(--amber-bg); color: var(--amber); }

    .mae-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; padding-top: 2px; }

    .btn-adiar {
      background: var(--amber-bg); color: var(--amber);
      border: none; border-radius: 8px; padding: 8px 12px;
      font-size: 12px; font-weight: 600; font-family: var(--fn);
      cursor: pointer; white-space: nowrap;
      -webkit-tap-highlight-color: transparent; transition: background .1s;
    }
    .btn-adiar:active { background: #FDE68A; }

    .btn-buy {
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--green-bg); color: var(--green);
      border: none; font-size: 18px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent; transition: background .1s;
      flex-shrink: 0;
    }
    .btn-buy:active { background: #BBF0D4; }

    .empty {
      padding: 72px 24px; text-align: center; color: var(--muted);
    }
    .empty .ico { font-size: 44px; margin-bottom: 12px; display: block; }
    .empty p { font-size: 15px; }
    .empty small { font-size: 13px; display: block; margin-top: 6px; opacity: .7; }
  </style>
</head>

let pin       = '';

function getMonday(d) {
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  const m = new Date(d);
  m.setDate(d.getDate() + diff);
  return m.toISOString().split('T')[0];
}
function addWeeks(iso, n) {
  const d = new Date(iso);
  d.setDate(d.getDate() + 7 * n);
  return d.toISOString().split('T')[0];
}
function fmtWeek(iso) {
  const [y, m, d] = iso.split('-');
  return `Semana de ${d}/${m}/${y}`;
}
function fmtShort(iso) {
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function weekRelLabel(iso) {
  if (iso === curWeek)               return 'Esta semana';
  if (iso === addWeeks(curWeek, 1))  return 'Próxima semana';
  if (iso === addWeeks(curWeek, -1)) return 'Semana passada';
  if (iso < curWeek)                 return 'Semana anterior';
  return 'Semana futura';
}

async function sb(path, opts = {}) {
  const res = await fetch(`${SB_URL}/rest/v1/${path}`, {
    headers: {
      'apikey': SB_KEY,
      'Authorization': `Bearer ${SB_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer ?? 'return=representation',
    },
    ...opts,
  });
  if (!res.ok) throw new Error(await res.text());
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

async function loadWeek(wk) {
  const rows = await sb(`pedidos?semana=eq.${wk}&select=*`);
  data = {};
  if (rows) rows.forEach(r => {
    data[`${r.categoria}|${r.item}`] = {
      id: r.id, quantidade: r.quantidade || '',
      status: r.status, semana_original: r.semana_original || r.semana,
      observacao: r.observacao || ''
    };
  });
}

async function addItem(cat, item) {
  const rows = await sb('pedidos', {
    method: 'POST',
    body: JSON.stringify({
      semana: curWeek, semana_original: curWeek,
      categoria: cat, item, quantidade: '1', status: 'pendente', observacao: ''
    }),
  });
  if (rows?.[0]) data[`${cat}|${item}`] = {
    id: rows[0].id, quantidade: '1', status: 'pendente', semana_original: curWeek, observacao: ''
  };
}

async function removeItem(cat, item) {
  const key = `${cat}|${item}`;
  if (!data[key]) return;
  await sb(`pedidos?id=eq.${data[key].id}`, { method: 'DELETE', prefer: '' });
  delete data[key];
}

async function patchItem(cat, item, fields) {
  const key = `${cat}|${item}`;
  if (!data[key]) return;
  await sb(`pedidos?id=eq.${data[key].id}`, {
    method: 'PATCH', body: JSON.stringify(fields), prefer: ''
  });
  Object.assign(data[key], fields);
}

async function adiarItem(cat, item) {
  const key = `${cat}|${item}`;
  const d = data[key];
  if (!d) return;
  const nextWk = addWeeks(viewWeek, 1);
  await sb(`pedidos?id=eq.${d.id}`, {
    method: 'PATCH', prefer: '',
    body: JSON.stringify({ semana: nextWk }),
  });
  delete data[key];
  toast(`Adiado para ${fmtShort(nextWk)}`);
  renderMaeList();
}

document.querySelectorAll('.nk[data-d]').forEach(b => b.addEventListener('click', () => pressDigit(b.dataset.d)));
document.getElementById('del-btn').addEventListener('click', delDigit);

function pressDigit(d) {
  if (pin.length >= 6) return;
  pin += d;
  refreshDots();
  if (pin.length === 6) setTimeout(checkPin, 120);
}
function delDigit() {
  pin = pin.slice(0, -1);
  refreshDots();
  document.getElementById('pin-hint').textContent = '';
}
function refreshDots() {
  for (let i = 0; i < 6; i++) {
    const el = document.getElementById(`pd${i}`);
    el.classList.toggle('filled', i < pin.length);
    el.classList.remove('error');
  }
}
function checkPin() {
  if (pin === PIN_FUNC) { startApp('func'); return; }
  if (pin === PIN_MAE)  { startApp('mae');  return; }
  for (let i = 0; i < 6; i++) document.getElementById(`pd${i}`).classList.add('error');
  const dots = document.getElementById('pin-dots');
  dots.classList.add('shake');
  document.getElementById('pin-hint').textContent = 'PIN incorreto. Tente novamente.';
  setTimeout(() => { pin = ''; refreshDots(); dots.classList.remove('shake'); }, 500);
}

async function startApp(r) {
  role = r;
  localStorage.setItem('lc_role', r);
  loading(true);
  document.getElementById('pin-screen').style.display = 'none';
  try {
    const wk = r === 'mae' ? viewWeek : curWeek;
    await loadWeek(wk);
    if (r === 'func') renderFunc();
    else               renderMae();
    document.getElementById(`${r}-screen`).classList.add('active');
  } catch(e) {
    console.error(e);
    toast('Erro ao conectar. Verifique a configuração.');
    document.getElementById('pin-screen').style.display = 'flex';
  } finally {
    loading(false);
  }
}
function logout() {
  localStorage.removeItem('lc_role');
  role = null; pin = '';
  viewWeek = curWeek;
  refreshDots();
  document.getElementById('pin-hint').textContent = '';
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('pin-screen').style.display = 'flex';
}

function renderFunc() {
  document.getElementById('func-week').textContent = fmtWeek(curWeek);
  const list = document.getElementById('func-list');
  list.innerHTML = '';

  CATALOG.forEach(({ cat, items }) => {
    const lbl = document.createElement('div');
    lbl.className = 'cat-label';
    lbl.textContent = cat;
    list.appendChild(lbl);

    const group = document.createElement('div');
    group.className = 'item-group';

    items.forEach(item => {
      const key    = `${cat}|${item}`;
      const d      = data[key];
      const marked = !!d;
      const qty    = d?.quantidade ?? '1';
      const obs    = d?.observacao ?? '';

      const wrapper = document.createElement('div');

      const row = document.createElement('div');
      row.className = 'func-row' + (marked ? ' marked' : '');
      row.dataset.cat  = cat;
      row.dataset.item = item;
      row.innerHTML = `
        <div class="check-box">
          <svg width="14" height="11" viewBox="0 0 14 11" fill="none">
            <path d="M1.5 5.5L5.5 9.5L12.5 1.5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="item-lbl">${item}</span>
        <div class="qty-wrap">
          <button class="qty-btn" data-dir="-1">−</button>
          <input class="qty-field" type="number" min="1" value="${qty}" inputmode="numeric">
          <button class="qty-btn" data-dir="1">+</button>
        </div>`;

      const obsDiv = document.createElement('div');
      obsDiv.className = 'obs-wrap';
      obsDiv.style.display = marked ? 'block' : 'none';
      obsDiv.innerHTML = `<textarea class="obs-field" rows="2" placeholder="Observação (opcional)...">${obs}</textarea>`;

      row.addEventListener('click', async e => {
        if (e.target.closest('.qty-wrap')) return;
        const wasMarked = row.classList.contains('marked');
        row.classList.toggle('marked');
        obsDiv.style.display = row.classList.contains('marked') ? 'block' : 'none';
        const cb = row.querySelector('.check-box');
        cb.style.animation = 'none';
        requestAnimationFrame(() => { cb.style.animation = ''; cb.classList.add('check-pulse'); });
        setTimeout(() => cb.classList.remove('check-pulse'), 400);
        setSaveDot(true);
        try {
          if (wasMarked) await removeItem(cat, item);
          else           await addItem(cat, item);
        } catch(err) {
          row.classList.toggle('marked');
          obsDiv.style.display = row.classList.contains('marked') ? 'block' : 'none';
          toast('Erro ao salvar. Tente novamente.');
        } finally {
          setSaveDot(false);
          updateCount();
          resetSaveBtn();
        }
      });

      row.querySelectorAll('.qty-btn').forEach(btn => {
        btn.addEventListener('click', async e => {
          e.stopPropagation();
          const input = row.querySelector('.qty-field');
          const next  = Math.max(1, (parseInt(input.value) || 1) + parseInt(btn.dataset.dir));
          input.value = next;
          setSaveDot(true);
          try { await patchItem(cat, item, { quantidade: String(next) }); }
          catch { toast('Erro ao salvar quantidade.'); }
          finally { setSaveDot(false); }
        });
      });

      row.querySelector('.qty-field').addEventListener('change', async e => {
        e.stopPropagation();
        const v = Math.max(1, parseInt(e.target.value) || 1);
        e.target.value = v;
        setSaveDot(true);
        try { await patchItem(cat, item, { quantidade: String(v) }); }
        catch { toast('Erro ao salvar quantidade.'); }
        finally { setSaveDot(false); }
      });

      obsDiv.querySelector('.obs-field').addEventListener('input', e => e.stopPropagation());
      obsDiv.querySelector('.obs-field').addEventListener('blur', async e => {
        const v = e.target.value.trim();
        setSaveDot(true);
        try { await patchItem(cat, item, { observacao: v }); }
        catch { toast('Erro ao salvar observação.'); }
        finally { setSaveDot(false); }
      });

      wrapper.appendChild(row);
      wrapper.appendChild(obsDiv);
      group.appendChild(wrapper);
    });
    list.appendChild(group);
  });
  updateCount();
}

function updateCount() {
  const n = Object.keys(data).length;
  document.getElementById('func-count').innerHTML = n === 0
    ? 'Nenhum item marcado'
    : `<strong>${n}</strong> ${n === 1 ? 'item marcado' : 'itens marcados'}`;
}

function resetSaveBtn() {
  const btn = document.getElementById('btn-save');
  if (btn) btn.classList.remove('saved');
}

function confirmarLista() {
  const btn = document.getElementById('btn-save');
  btn.textContent = 'Lista salva!';
  btn.classList.add('saved');
  toast('✓ Lista salva com sucesso!');
  setTimeout(() => {
    btn.textContent = 'Salvar lista';
    btn.classList.remove('saved');
  }, 3000);
}

function renderMae() {
  document.getElementById('mae-week-bar').textContent = fmtWeek(viewWeek);
  updateWeekNav();
  renderMaeList();
}

function updateWeekNav() {
  document.getElementById('wn-date').textContent = fmtShort(viewWeek);
  const tag = document.getElementById('wn-tag');
  const rel = weekRelLabel(viewWeek);
  tag.textContent = rel;
  tag.className = 'wn-tag' + (rel === 'Esta semana' ? ' current' : '');
  document.getElementById('wn-next').disabled = viewWeek >= addWeeks(curWeek, 4);
  document.getElementById('mae-week-bar').textContent = fmtWeek(viewWeek);
}

async function navWeek(dir) {
  viewWeek = addWeeks(viewWeek, dir);
  loading(true);
  try {
    await loadWeek(viewWeek);
    updateWeekNav();
    renderMaeList();
  } catch(e) {
    toast('Erro ao carregar semana.');
  } finally {
    loading(false);
  }
}

function setTab(t) {
  activeTab = t;
  document.getElementById('tab-pend').classList.toggle('active', t === 'pendente');
  document.getElementById('tab-comp').classList.toggle('active', t === 'comprado');
  renderMaeList();
}

function renderMaeList() {
  const list = document.getElementById('mae-list');
  list.innerHTML = '';
  let nPend = 0, nComp = 0;
  const sections = [];

  CATALOG.forEach(({ cat, items }) => {
    const rows = [];
    items.forEach(item => {
      const d = data[`${cat}|${item}`];
      if (!d) return;
      if (d.status === 'pendente') nPend++;
      else                         nComp++;
      if (d.status === activeTab)  rows.push({ item, d });
    });
    if (rows.length) sections.push({ cat, rows });
  });

  document.getElementById('n-pend').textContent = nPend ? `(${nPend})` : '';
  document.getElementById('n-comp').textContent = nComp ? `(${nComp})` : '';

  if (!sections.length) {
    list.innerHTML = activeTab === 'pendente'
      ? `<div class="empty"><span class="ico">✅</span><p>Tudo comprado!</p><small>Nenhum item pendente nessa semana.</small></div>`
      : `<div class="empty"><span class="ico">🛒</span><p>Nenhum item comprado ainda.</p></div>`;
    return;
  }

  sections.forEach(({ cat, rows }) => {
    const lbl = document.createElement('div');
    lbl.className = 'cat-label';
    lbl.textContent = cat;
    list.appendChild(lbl);

    const group = document.createElement('div');
    group.className = 'item-group';

    rows.forEach(({ item, d }) => {
      const isAdiado = d.semana_original && d.semana_original !== viewWeek;
      const row = document.createElement('div');
      row.className = 'mae-row' + (d.status === 'comprado' ? ' faded' : '');

      const badges = `
        <span class="badge ${d.status}">${d.status === 'pendente' ? 'Pendente' : '✓ Comprado'}</span>
        ${isAdiado ? `<span class="badge adiado">Adiado de ${fmtShort(d.semana_original)}</span>` : ''}
      `;

      if (activeTab === 'pendente') {
        row.innerHTML = `
          <div class="mae-info">
            <div class="mae-name">${item}</div>
            ${d.quantidade ? `<div class="mae-qty">Qtd: ${d.quantidade}</div>` : ''}
            ${d.observacao ? `<div class="mae-qty" style="font-style:italic">📝 ${d.observacao}</div>` : ''}
            <div class="mae-badges">${badges}</div>
          </div>
          <div class="mae-actions">
            <button class="btn-adiar">Adiar →</button>
            <button class="btn-buy">✓</button>
          </div>`;
        row.querySelector('.btn-buy').addEventListener('click', async () => {
          loading(true);
          try { await patchItem(cat, item, { status: 'comprado' }); renderMaeList(); toast('✓ Comprado!'); }
          catch { toast('Erro ao atualizar.'); }
          finally { loading(false); }
        });
        row.querySelector('.btn-adiar').addEventListener('click', async () => {
          loading(true);
          try { await adiarItem(cat, item); }
          catch { toast('Erro ao adiar.'); }
          finally { loading(false); }
        });
        row.querySelector('.mae-info').addEventListener('click', async () => {
          loading(true);
          try { await patchItem(cat, item, { status: 'comprado' }); renderMaeList(); toast('✓ Comprado!'); }
          catch { toast('Erro ao atualizar.'); }
          finally { loading(false); }
        });
      } else {
        row.innerHTML = `
          <div class="mae-info">
            <div class="mae-name">${item}</div>
            ${d.quantidade ? `<div class="mae-qty">Qtd: ${d.quantidade}</div>` : ''}
            ${d.observacao ? `<div class="mae-qty" style="font-style:italic">📝 ${d.observacao}</div>` : ''}
            <div class="mae-badges">${badges}</div>
          </div>`;
        row.querySelector('.mae-info').addEventListener('click', async () => {
          loading(true);
          try { await patchItem(cat, item, { status: 'pendente' }); renderMaeList(); }
          catch { toast('Erro ao atualizar.'); }
          finally { loading(false); }
        });
      }
      group.appendChild(row);
    });
    list.appendChild(group);
  });
}

function loading(show) { document.getElementById('loading').classList.toggle('hidden', !show); }
function setSaveDot(on) { document.getElementById('save-dot')?.classList.toggle('on', on); }
let toastTmr;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTmr);
  toastTmr = setTimeout(() => el.classList.remove('show'), 2600);
}

loading(false);
const savedRole = localStorage.getItem('lc_role');
if (savedRole) {
  document.getElementById('pin-screen').style.display = 'none';
  startApp(savedRole);
}
</script>
</body>
